[project]
name = "uv-release"
version = "0.3.2"
description = "Easy release script using uv"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.24.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.uv]
package = true

[project.scripts]
release = "uv_release.main:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "S", "I"]
